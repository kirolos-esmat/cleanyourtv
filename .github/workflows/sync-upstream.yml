name: Auto Sync Upstream & Trigger CI

on:
  schedule:
    - cron: '*/30 * * * *' # Checks every 30 minutes for new commits in original branch
  workflow_dispatch:      # Allows manual trigger anytime from the Actions tab

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync with Upstream & Run CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git 2>/dev/null || git remote set-url upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch upstream main

      - name: Check for new commits, merge and trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          UPSTREAM_COMMITS=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits behind: $UPSTREAM_COMMITS"
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "New commits found in original branch ($UPSTREAM_COMMITS). Merging upstream/main..."
            git merge --no-commit --no-ff upstream/main || true
            # Preserve our fork's own workflows so GITHUB_TOKEN push is never blocked
            git checkout HEAD -- .github
            git commit -m "chore(sync): automated sync with upstream main" || true
            git push origin main
            echo "Triggering CI workflow for new commits..."
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref main || true
          else
            echo "No new commits in original branch. Everything up to date."
          fi
